<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Chat</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<main>

    <!-- Login -->
    <section id="loginSection">

        <h1>Secure Chat</h1>

        <form id="loginForm">

            <label for="loginEmail">
                Email
            </label>

            <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
            >

            <label for="loginPassword">
                Password
            </label>

            <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <button type="button" id="showRegister">
            Create account
        </button>

    </section>


    <!-- Register -->
    <section id="registerSection" hidden>

        <h1>Create Account</h1>

        <form id="registerForm">

            <label for="registerUsername">
                Username
            </label>

            <input
                    type="text"
                    id="registerUsername"
                    placeholder="Username"
                    required
            >

            <label for="registerEmail">
                Email
            </label>

            <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required
            >

            <label for="registerPassword">
                Password
            </label>

            <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    required
            >

            <label for="confirmPassword">
                Confirm password
            </label>

            <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
            >

            <button type="submit">
                Create account
            </button>

        </form>

        <p id="registerMessage"></p>

        <button type="button" id="showLogin">
            Back to login
        </button>

    </section>


    <!-- User area -->
    <section id="userInfo" hidden>

        <header>
            <h1>Secure Chat</h1>

            <div>
                <p id="username"></p>
                <p id="userEmail"></p>

                <p>
                    Your User ID:
                    <span id="currentUserId"></span>
                </p>

                <button
                        type="button"
                        id="copyUserId"
                >
                    Copy User ID
                </button>

                <p id="copyMessage"></p>

                <button
                        type="button"
                        id="logout"
                >
                    Logout
                </button>

                <p id="logoutMessage"></p>

            </div>
        </header>


        <!-- Find user -->
        <section id="findUserSection">

            <h2>Find User</h2>

            <form id="findUserForm">

                <label for="userId">
                    User ID
                </label>

                <input
                        type="text"
                        id="userId"
                        placeholder="Enter user ID"
                        required
                >

                <button type="submit">
                    Find User
                </button>

            </form>

            <p id="findUserMessage"></p>

        </section>


        <!-- Found user -->
        <section id="foundUser" hidden>

            <h2>User</h2>

            <p>
                Username:
                <span id="foundUsername"></span>
            </p>

            <p>
                User ID:
                <span id="foundUserId"></span>
            </p>

            <button
                    type="button"
                    id="addFriend"
            >
                Add Friend
            </button>

            <p id="friendMessage"></p>

        </section>

        <!-- Friend requests -->
        <section id="friendRequestsSection">

            <h2>Friend Requests</h2>

            <div id="friendRequests">
                <!-- Friend requests will be inserted here -->
            </div>

        </section>


        <!-- Friends -->
        <section id="friendsSection">

            <h2>Friends</h2>

            <div id="friendsList">
                <!-- Friends will be inserted here -->
            </div>

        </section>


        <!-- Conversations -->
        <section id="conversationsSection">

            <h2>Conversations</h2>

            <div id="conversationsList">
                <!-- Conversations will be inserted here -->
            </div>

        </section>

    </section>

</main>

<script src="/js/app.js"></script>

</body>
</html>
